<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard - India</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .selection-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        .input-group select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            cursor: pointer;
        }

        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .btn-fetch {
            grid-column: 1 / -1;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-fetch:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-fetch:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .weather-display {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .weather-display.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .location-name {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 5px;
        }

        .weather-description {
            color: #666;
            font-size: 1.1rem;
            text-transform: capitalize;
        }

        .main-weather {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
        }

        .weather-icon {
            font-size: 5rem;
        }

        .temperature {
            text-align: center;
        }

        .temp-value {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
        }

        .feels-like {
            color: #666;
            font-size: 1rem;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .detail-unit {
            font-size: 0.9rem;
            color: #999;
        }

        .error-message {
            display: none;
            padding: 15px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 10px;
            color: #c33;
            margin-top: 20px;
        }

        .error-message.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-key-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 0.9rem;
        }

        .api-key-notice a {
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .selection-section {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .weather-card {
                padding: 25px;
            }

            .main-weather {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information across India</p>
        </div>

        <div class="weather-card">
            <div class="api-key-notice" id="api-notice">
                ⚠️ <strong>Setup Required:</strong> Get a FREE API key from 
                <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap</a> 
                and paste it in the script at the bottom of this file (line ~350).
            </div>

            <div class="selection-section">
                <div class="input-group">
                    <label for="state-select">Select State</label>
                    <select id="state-select">
                        <option value="">-- Choose a State --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="city-select">Select City</label>
                    <select id="city-select" disabled>
                        <option value="">-- First Select a State --</option>
                    </select>
                </div>

                <button class="btn-fetch" id="fetch-btn" disabled>Get Weather</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching weather data...</p>
            </div>

            <div class="error-message" id="error-message"></div>

            <div class="weather-display" id="weather-display">
                <div class="weather-header">
                    <h2 class="location-name" id="location-name"></h2>
                    <p class="weather-description" id="weather-description"></p>
                </div>

                <div class="main-weather">
                    <div class="weather-icon" id="weather-icon"></div>
                    <div class="temperature">
                        <div class="temp-value" id="temperature"></div>
                        <div class="feels-like" id="feels-like"></div>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="wind-speed"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value" id="pressure"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value" id="visibility"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 🔑 ADD YOUR API KEY HERE (Get free at: https://openweathermap.org/api)
        // ============================================
        const API_KEY = 'YOUR_API_KEY_HERE';  // ⬅️ REPLACE THIS!

        // Indian States and Cities Data
        const INDIA_LOCATIONS = {
            "Delhi": {
                "New Delhi": { lat: 28.6139, lon: 77.2090 },
                "Old Delhi": { lat: 28.6507, lon: 77.2334 },
                "Dwarka": { lat: 28.5921, lon: 77.0460 }
            },
            "Maharashtra": {
                "Mumbai": { lat: 19.0760, lon: 72.8777 },
                "Pune": { lat: 18.5204, lon: 73.8567 },
                "Nagpur": { lat: 21.1458, lon: 79.0882 }
            },
            "Karnataka": {
                "Bangalore": { lat: 12.9716, lon: 77.5946 },
                "Mysore": { lat: 12.2958, lon: 76.6394 },
                "Mangalore": { lat: 12.9141, lon: 74.8560 }
            },
            "Tamil Nadu": {
                "Chennai": { lat: 13.0827, lon: 80.2707 },
                "Coimbatore": { lat: 11.0168, lon: 76.9558 },
                "Madurai": { lat: 9.9252, lon: 78.1198 }
            },
            "West Bengal": {
                "Kolkata": { lat: 22.5726, lon: 88.3639 },
                "Darjeeling": { lat: 27.0360, lon: 88.2627 },
                "Siliguri": { lat: 26.7271, lon: 88.3953 }
            },
            "Rajasthan": {
                "Jaipur": { lat: 26.9124, lon: 75.7873 },
                "Udaipur": { lat: 24.5854, lon: 73.7125 },
                "Jodhpur": { lat: 26.2389, lon: 73.0243 }
            },
            "Gujarat": {
                "Ahmedabad": { lat: 23.0225, lon: 72.5714 },
                "Surat": { lat: 21.1702, lon: 72.8311 },
                "Vadodara": { lat: 22.3072, lon: 73.1812 }
            },
            "Kerala": {
                "Thiruvananthapuram": { lat: 8.5241, lon: 76.9366 },
                "Kochi": { lat: 9.9312, lon: 76.2673 },
                "Kozhikode": { lat: 11.2588, lon: 75.7804 }
            }
        };

        // Weather icon mapping
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        // DOM Elements
        const stateSelect = document.getElementById('state-select');
        const citySelect = document.getElementById('city-select');
        const fetchBtn = document.getElementById('fetch-btn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const weatherDisplay = document.getElementById('weather-display');
        const apiNotice = document.getElementById('api-notice');

        // Initialize state dropdown
        function initializeStates() {
            const states = Object.keys(INDIA_LOCATIONS);
            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            });
        }

        // When state changes, load cities
        stateSelect.addEventListener('change', function() {
            const state = this.value;
            
            citySelect.innerHTML = '<option value="">-- Choose a City --</option>';
            citySelect.disabled = true;
            fetchBtn.disabled = true;
            
            if (!state) {
                citySelect.innerHTML = '<option value="">-- First Select a State --</option>';
                return;
            }

            const cities = Object.keys(INDIA_LOCATIONS[state]);
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
            
            citySelect.disabled = false;
        });

        // Enable fetch button when city is selected
        citySelect.addEventListener('change', function() {
            fetchBtn.disabled = !this.value;
        });

        // Fetch weather data
        fetchBtn.addEventListener('click', async function() {
            const state = stateSelect.value;
            const city = citySelect.value;

            if (!state || !city) return;

            // Check if API key is set
            if (API_KEY === 'YOUR_API_KEY_HERE') {
                showError('⚠️ Please add your OpenWeatherMap API key in the script! Get a free key at https://openweathermap.org/api');
                return;
            }

            hideError();
            weatherDisplay.classList.remove('active');
            loading.classList.add('active');

            const coords = INDIA_LOCATIONS[state][city];
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${coords.lat}&lon=${coords.lon}&appid=${API_KEY}&units=metric`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (response.ok) {
                    displayWeather(data, city, state);
                    // Hide API notice once it works
                    apiNotice.style.display = 'none';
                } else {
                    if (data.cod === 401) {
                        showError('❌ Invalid API key! Please check your OpenWeatherMap API key.');
                    } else {
                        showError(`❌ Error: ${data.message || 'Failed to fetch weather data'}`);
                    }
                }
            } catch (error) {
                showError('❌ Network error. Please check your internet connection and try again.');
            } finally {
                loading.classList.remove('active');
            }
        });

        function displayWeather(data, city, state) {
            document.getElementById('location-name').textContent = `${city}, ${state}`;
            document.getElementById('weather-description').textContent = data.weather[0].description;
            document.getElementById('weather-icon').textContent = weatherIcons[data.weather[0].icon] || '🌤️';
            document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
            document.getElementById('feels-like').textContent = `Feels like ${Math.round(data.main.feels_like)}°C`;
            document.getElementById('humidity').innerHTML = `${data.main.humidity}<span class="detail-unit">%</span>`;
            document.getElementById('wind-speed').innerHTML = `${Math.round(data.wind.speed * 3.6)}<span class="detail-unit">km/h</span>`;
            document.getElementById('pressure').innerHTML = `${data.main.pressure}<span class="detail-unit">hPa</span>`;
            document.getElementById('visibility').innerHTML = `${(data.visibility / 1000).toFixed(1)}<span class="detail-unit">km</span>`;

            weatherDisplay.classList.add('active');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        function hideError() {
            errorMessage.classList.remove('active');
        }

        // Initialize on page load
        initializeStates();
    </script>
</body>
</html>
